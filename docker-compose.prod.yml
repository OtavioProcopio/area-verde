name: area-verde-onprem

# Stack de producao on-premise (notebook do bar).
#
# Diferencas deliberadas em relacao ao docker-compose.local.yml:
# - sem senha padrao: POSTGRES_PASSWORD sem valor no .env sobe vazia e a
#   propria imagem oficial do postgres recusa iniciar (nao ha fallback fraco
#   tipo "local-dev-only").
# - "restart: unless-stopped" em tudo, para sobreviver a reboot do notebook.
# - porta do Postgres NAO e publicada no host: so a API (dentro da rede
#   docker) fala com o banco. Reduz superficie de ataque mesmo dentro da
#   rede local do bar.
# - porta da API tambem nao e publicada: o frontend (nginx) e o unico ponto
#   de entrada e faz proxy reverso de /api para o servico "api".
# - RUN_MIGRATIONS=true por padrao: cada atualizacao (git pull + up --build)
#   aplica migrations pendentes automaticamente.
#
# Ver docs/workflows/deploy-onpremise-windows.md para o guia completo.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-area_verde}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-area_verde}
    volumes:
      - area_verde_onprem_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - area-verde-onprem

  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-area_verde}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-area_verde}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost,http://127.0.0.1}
    networks:
      - area-verde-onprem

  frontend:
    build:
      context: ../area-verde-frontend/app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_APP_NAME: ${VITE_APP_NAME:-Area Verde}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - area-verde-onprem

volumes:
  area_verde_onprem_postgres_data:

networks:
  area-verde-onprem:
    driver: bridge
