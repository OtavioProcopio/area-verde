name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
      - "feature/**"
      - "bugfix/**"
      - "docs/**"
      - "chore/**"

env:
  PYTHON_VERSION: "3.11"
  POSTGRES_USER: area_verde_ci
  POSTGRES_PASSWORD: ci-${{ github.run_id }}
  POSTGRES_DB: area_verde_ci
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  RUN_MIGRATIONS: "false"
  LOG_LEVEL: INFO

jobs:
  validate:
    name: Build, test and validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PR source for main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          head_ref="${{ github.head_ref }}"

          if [[ "$head_ref" =~ ^hotfix/.+ ]]; then
            exit 0
          fi

          if [[ "$head_ref" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi

          echo "Pull requests to main must come from release/vMAJOR.MINOR.PATCH or hotfix/* branches."
          echo "Current source branch: $head_ref"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Build check
        run: python -m py_compile api.py

      - name: Format check
        run: black --check .

      - name: Import order check
        run: isort --check-only .

      - name: Lint
        run: flake8 --max-line-length=88 --exclude=.venv .

      - name: Type check
        run: mypy --ignore-missing-imports --explicit-package-bases .

      - name: Tests
        run: pytest . -v -m "not integration"

      - name: Docker Compose config
        run: docker compose config

      - name: Docker build
        run: docker build -t area-verde-api-test .

  open-pr:
    name: Open PR to develop
    runs-on: ubuntu-latest
    needs: validate
    if: >
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/heads/feature/') ||
       startsWith(github.ref, 'refs/heads/bugfix/') ||
       startsWith(github.ref, 'refs/heads/docs/') ||
       startsWith(github.ref, 'refs/heads/chore/'))

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PR to develop exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${{ github.ref_name }}"

          existing=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base develop \
            --head "$branch" \
            --state open \
            --json number --jq 'length')

          if [ "$existing" -gt 0 ]; then
            echo "PR de '$branch' para 'develop' já existe."
            exit 0
          fi

          gh pr create \
            --repo "${{ github.repository }}" \
            --base develop \
            --head "$branch" \
            --title "$branch" \
            --body "PR aberta automaticamente pelo CI a partir da branch \`$branch\`."
