name: area-verde-local

services:
  db:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT_LOCAL:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-area_verde}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-area_verde}
    volumes:
      - area_verde_local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - area-verde-local

  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-area_verde}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-area_verde}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    networks:
      - area-verde-local

  frontend:
    build:
      context: ../area-verde-frontend/app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_APP_NAME: ${VITE_APP_NAME:-Area Verde}
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT_LOCAL:-3000}:80"
    networks:
      - area-verde-local

volumes:
  area_verde_local_postgres_data:

networks:
  area-verde-local:
    driver: bridge
